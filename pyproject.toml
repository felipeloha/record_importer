[project]
name = "crate2discogs"
version = "0.1.0"
description = "Turn phone photos of vinyl records into Discogs collection entries"
readme = "README.md"
authors = [
    { name = "Felipe Loha", email = "flh@mail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
crate2discogs = "crate2discogs.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "python-barcode>=0.16.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["barcode.*", "pillow_heif", "respx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs real services (Discogs, Ollama, claude); excluded by default"]

[tool.coverage.run]
source = ["crate2discogs"]
